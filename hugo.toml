# ─────────────────────────────────────────────────────────────────────────
# pagegen — canonical boulingua language-course template (Hugo + hugo-coder).
#
# TO INSTANTIATE A NEW LANGUAGE COURSE, change only the marked values:
#   • baseURL, title, languageCode, defaultContentLanguage, [params].navTitle,
#     description, keywords
#   • the [[params.social]] repo URL and [params.plausible].domain
#   • the [[menu.main]] section entries (mirror your content/<course>/ sections)
#   • data/accents.yaml already carries every language's signature colour; the
#     accent is selected by the site `code` (see assets/css/custom.css).
# Everything else is the shared standard and should NOT be edited per course.
# ─────────────────────────────────────────────────────────────────────────

baseURL = "https://boulingua.github.io/nvt/"
title = "NVT — Nederlands als vreemde taal"
languageCode = "de"   # the CHROME language. Content is Dutch; the interface
                      # and the task rubrics a Gesamtschule pupil reads are German.
defaultContentLanguage = "de"
enableEmoji = false
enableRobotsTXT = true

[pagination]
  pagerSize = 20

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false

# Tags are DECLARED, not implicit — derive them from structured fields.
[taxonomies]
  tag = "tags"
  skill = "skills"
  level = "levels"
  topic = "topics"

[params]
  navTitle = "Nederlands"
  author = "S. Le Boulanger"
  description = "Niederländisch für die Gesamtschule — kompetenzorientierte Einheiten, Prüfungen, Materialien und Audio." # CHANGE
  keywords = "Niederländisch,Nederlands,CEFR,Gesamtschule,OER,Unterrichtsmaterial"
  dateFormat = "2006-01-02"
  since = 2025
  colorScheme = "auto"
  hideCredits = true
  # The colour-scheme toggle is a labelled control in the navbar
  # (layouts/_partials/header.html); disable the theme's floating duplicate
  # so there is exactly one toggle on the page.
  hideColorSchemeToggle = true
  customCSS = ["css/tokens.css", "css/custom.css"]   # tokens first: custom.css consumes them
  # Site code — selects this course's accent from data/accents.yaml.
  # Which font payload this course loads. One of the shipped tiers in
  # design/fonts.yaml: core, latin-ext, greek, cyrillic. `kit sync` refuses a
  # course whose tier is deferred.
  scriptTier = "core"        # Latin, no complex shaping, no transliteration layer
  # The language {{< tl >}} tags its runs with. A unit author never types a
  # language code; the shortcode reads it from here.
  targetLanguage = "nl"      # Standaardnederlands, the Netherlands norm
  code = "nvt"   # "template" resolves to the neutral
                      # graphite accent, so an unconfigured course looks obviously
                      # wrong instead of looking like DaF. Gate F7-C3 makes it fatal.
  # Content licence, surfaced by pdf attribution + legal pages.
  license = "CC BY-SA 4.0"

  # IMPORTANT — every sub-table under [params] MUST come AFTER all bare
  # [params] keys. TOML scopes everything after a header to that header, so
  # opening [params.plausible] before the keys above would silently move them
  # under params.plausible and leave the site unstyled. Keep this block LAST.
  [params.plausible]
    # Privacy-friendly, cookieless analytics. Set domain to enable; leave
    # empty to disable (the head partial is guarded on domain).
      domain = "boulingua.github.io/nvt"   # gate C9 compares this against the emitted data-domain
    src = "https://plausible.io/js/script.js"

[[params.social]]
  name = "GitHub"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/boulingua/nvt"

# ── Navigation — mirror your content/<course>/ sections here. ──────────────
# Start lives behind the navbar brand. Groups have an identifier; children set
# `parent`. This is the standard menu shape every course follows.
[[menu.main]]
  name = "Levels"
  weight = 2
  identifier = "levels"
[[menu.main]]
  parent = "levels"
  weight = 21
  name = "A1 — Beginner (example)"
  url = "/level-a1/"

[[menu.main]]
  name = "Materials"
  weight = 3
  identifier = "materials"
[[menu.main]]
  parent = "materials"
  weight = 31
  name = "Slide decks"
  url = "/materials/presentations/"
[[menu.main]]
  parent = "materials"
  weight = 32
  name = "Worksheets"
  url = "/materials/worksheets/"

[[menu.main]]
  name = "About"
  weight = 4
  identifier = "about"
[[menu.main]]
  parent = "about"
  weight = 41
  name = "About this course"
  url = "/about/"

[[menu.main]]
  name = "Legal"
  weight = 9
  identifier = "legal"
[[menu.main]]
  parent = "legal"
  weight = 91
  name = "Impressum"
  url = "/impressum/"
[[menu.main]]
  parent = "legal"
  weight = 92
  name = "Datenschutz"
  url = "/datenschutz/"
[[menu.main]]
  parent = "legal"
  weight = 93
  name = "Haftungsausschluss"
  url = "/haftungsausschluss/"

[module]
  # Import order is load-bearing, and it is the opposite of what reads
  # naturally. Hugo resolves module files FIRST-MATCH-WINS in listed order, so
  # the kit must come BEFORE hugo-coder to override it — the theme ships its own
  # empty body/extensions.html and head/extensions.html stubs, and listed second
  # the kit is never reached. On a course with registered VG Wort marks that
  # removes every counting pixel from the site on a green build.
  #
  # The kit was missing from this template entirely, so every course scaffolded
  # from it would have been created without the platform.
  [[module.imports]]
    path = "github.com/boulingua/kit"
  [[module.imports]]
    path = "github.com/luizdepra/hugo-coder"
