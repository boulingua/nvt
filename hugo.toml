# ─────────────────────────────────────────────────────────────────────────
# nvt — Nederlands als Vreemde Taal (boulingua Dutch course).
#
# Instantiated from `pagegen`, the canonical boulingua course template. Only
# the values marked "per course" in the template have been changed here
# (baseURL, title, languageCode, defaultContentLanguage, navTitle,
# description, keywords, the social repo URL, params.code,
# params.plausible.domain, and the [[menu.main]] section entries).
# Everything else is the shared standard and must not drift.
# ─────────────────────────────────────────────────────────────────────────

baseURL = "https://boulingua.github.io/nvt/"
title = "Nederlands — S. Le Boulanger"
languageCode = "nl"
defaultContentLanguage = "nl"
enableEmoji = false
enableRobotsTXT = true

[pagination]
  pagerSize = 20

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false

# Tags are DECLARED, not implicit — derive them from structured fields.
[taxonomies]
  tag = "tags"
  skill = "skills"
  level = "levels"
  topic = "topics"

[params]
  navTitle = "Nederlands"
  author = "S. Le Boulanger"
  description = "Een vrije, open gelicentieerde cursus Nederlands als vreemde taal, A1 tot C1, met eenheden volgens het GER, modelexamens, lesmateriaal en audio."
  keywords = "Nederlands,NVT,Nederlands als vreemde taal,GER,CEFR,A1,A2,B1,B2,C1,OER,curriculum,Gesamtschule,Vlaams"
  dateFormat = "2006-01-02"
  since = 2025
  colorScheme = "auto"
  hideCredits = true
  # The colour-scheme toggle is a labelled control in the navbar
  # (layouts/_partials/header.html); disable the theme's floating duplicate
  # so there is exactly one toggle on the page.
  hideColorSchemeToggle = true
  customCSS = ["css/custom.css"]
  # Site code — selects this course's accent (#198D34 / #7EE797) from
  # data/accents.yaml. Never edit the CSS to change the accent.
  code = "nvt"
  # Content licence, surfaced by pdf attribution + legal pages.
  license = "CC BY-SA 4.0"

  # IMPORTANT — every sub-table under [params] MUST come AFTER all bare
  # [params] keys. TOML scopes everything after a header to that header, so
  # opening [params.plausible] before the keys above would silently move them
  # under params.plausible and leave the site unstyled. Keep this block LAST.
  [params.plausible]
    # Privacy-friendly, cookieless analytics on the author's self-hosted
    # instance (server in Germany); disclosed in /datenschutz/. Leave the
    # domain empty to disable (the head partial is guarded on domain).
    domain = "boulingua.github.io/nvt"
    src = "https://analytics.hellebo.de/js/script.file-downloads.outbound-links.js"

[[params.social]]
  name = "GitHub"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/boulingua/nvt"

# ── Navigation — mirrors content/. Start lives behind the navbar brand. ────
# Groups carry an identifier; children set `parent`. Klank & spelling is the
# pre-A1 onboarding block: it is an appendix, not a CEFR level (ROADMAP §2),
# but it is the entry point of the learning path and so heads the Niveaus
# group.
[[menu.main]]
  name = "Niveaus"
  weight = 2
  identifier = "levels"
[[menu.main]]
  parent = "levels"
  weight = 20
  name = "Klank & spelling"
